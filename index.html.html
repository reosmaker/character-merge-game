<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラ合体ゲーム</title><style>
*{box-sizing:border-box}body{margin:0;background:#121827;color:#f5f7ff;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:18px}h1{font-size:25px;margin:5px 0 12px}.layout{display:grid;grid-template-columns:minmax(0,440px) minmax(260px,1fr);gap:18px}.panel{background:#202b40;border-radius:16px;padding:14px}.stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}button{background:#ffcc66;color:#1c2330;border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}canvas{width:100%;height:auto;display:block;background:#f7e7c5;border:5px solid #b98958;border-top:0;border-radius:0 0 14px 14px;touch-action:none;cursor:crosshair}.help{font-size:13px;color:#c6d0e0;line-height:1.6}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.slot{background:#2b3850;border-radius:10px;padding:8px;text-align:center;font-size:12px}.preview{height:64px;display:grid;place-items:center;margin-bottom:6px}.preview img{width:60px;height:60px;object-fit:cover;border-radius:50%;border:2px solid #fff}.slot input{width:100%;font-size:10px}.slot button{font-size:11px;padding:5px;margin-top:5px}.hint{margin-top:10px;font-size:12px;color:#cbd5e1}#notice{min-height:20px;color:#ffda82;font-size:13px}@media(max-width:730px){.layout{grid-template-columns:1fr}.panel{padding:11px}.slots{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><h1>🍉 キャラ合体ゲーム</h1><div class="layout"><section class="panel"><div class="stats"><div>スコア <strong id="score">0</strong><br><small>次: <span id="next">1</span>段階目</small></div><button id="restart">最初から</button></div><canvas id="game" width="420" height="620" aria-label="ゲーム画面"></canvas><p class="help">マウス・指で位置を決めてクリック／タップで落とす。同じレベル同士をくっつけよう！ 上部に積み上がるとゲームオーバー。</p><div id="notice" role="status"></div></section><section class="panel"><h2 style="margin-top:0;font-size:19px">キャラクター画像設定</h2><p class="help">各レベルに好きな画像を設定できます。画像はこのブラウザ内だけに保存され、サーバーへ送信されません。</p><div class="slots" id="slots"></div><p class="hint">画像は正方形にトリミングして丸く表示します。ブラウザの保存容量を超えた場合は保存されません。</p><button id="resetImages">画像設定をすべて初期化</button></section></div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=420,H=620;
const radii=[15,19,24,30,37,45,54,65,77,91,106];
const colors=['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff','#ffbd69','#84dcc6','#ff8fab'];
const emojis=['🐣','🐱','🐶','🐼','🦊','🐸','🐯','🦁','🐲','👑','🌟'];
const imgs=Array(11).fill(null),sources=Array(11).fill(null);
const slots=document.getElementById('slots'),scoreEl=document.getElementById('score'),nextEl=document.getElementById('next'),notice=document.getElementById('notice');
let balls=[],score=0,nextLevel=0,aimX=W/2,canDrop=true,gameOver=false,overTime=0,last=performance.now(),acc=0;
function storageKey(i){return 'char-merge-img-v1-'+i}
function loadImage(i,data){if(!data){sources[i]=null;imgs[i]=null;drawSlot(i);return}const im=new Image();im.onload=()=>{imgs[i]=im;sources[i]=data;drawSlot(i)};im.onerror=()=>{imgs[i]=null;drawSlot(i)};im.src=data}
function drawSlot(i){const el=document.getElementById('preview-'+i);if(!el)return;el.replaceChildren();if(imgs[i]){const image=document.createElement('img');image.src=sources[i];image.alt='レベル'+(i+1);el.append(image)}else{el.textContent=emojis[i];el.style.fontSize='35px'}}
for(let i=0;i<11;i++){const slot=document.createElement('div');slot.className='slot';slot.innerHTML=`<b>Lv.${i+1}</b><div class="preview" id="preview-${i}"></div><input type="file" accept="image/png,image/jpeg,image/webp" aria-label="レベル${i+1}の画像"><button type="button">削除</button>`;slots.append(slot);drawSlot(i);try{const data=localStorage.getItem(storageKey(i));if(data)loadImage(i,data)}catch(e){}const file=slot.querySelector('input');file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){notice.textContent='PNG・JPG・WebP画像を選んでください';return}try{const url=URL.createObjectURL(f),im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url});const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');const side=Math.min(im.width,im.height);g.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,160,160);URL.revokeObjectURL(url);const data=c.toDataURL('image/jpeg',.76);loadImage(i,data);try{localStorage.setItem(storageKey(i),data);notice.textContent='画像を保存しました'}catch(e){notice.textContent='画像は反映しましたが、保存容量のため次回まで保存できません'}}catch(e){notice.textContent='画像を読み込めませんでした'}file.value=''});slot.querySelector('button').onclick=()=>{loadImage(i,null);try{localStorage.removeItem(storageKey(i))}catch(e){}}}
document.getElementById('resetImages').onclick=()=>{for(let i=0;i<11;i++){loadImage(i,null);try{localStorage.removeItem(storageKey(i))}catch(e){}}notice.textContent='画像設定を初期化しました'};
function reset(){balls=[];score=0;nextLevel=Math.floor(Math.random()*4);aimX=W/2;canDrop=true;gameOver=false;overTime=0;scoreEl.textContent='0';nextEl.textContent=nextLevel+1;notice.textContent=''}document.getElementById('restart').onclick=reset;
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function pointer(e){const r=canvas.getBoundingClientRect();aimX=clamp((e.clientX-r.left)*W/r.width,20,W-20)}
canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{pointer(e);drop()});
function drop(){if(!canDrop||gameOver)return;const r=radii[nextLevel];balls.push({x:clamp(aimX,r,W-r),y:35,vx:0,vy:0,r,level:nextLevel,age:0,id:Math.random()});nextLevel=Math.floor(Math.random()*4);nextEl.textContent=nextLevel+1;canDrop=false;setTimeout(()=>{canDrop=true},380)}
function merge(a,b){const level=a.level+1;const x=(a.x+b.x)/2,y=(a.y+b.y)/2;balls=balls.filter(v=>v!==a&&v!==b);if(level<11)balls.push({x,y,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2,r:radii[level],level,age:0,id:Math.random()});score+=(level+1)*10;scoreEl.textContent=score}
function step(dt){const gravity=1350;for(const b of balls){b.age+=dt;b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.996;b.vy*=.998;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.3}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.3}if(b.y+b.r>H){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.16;b.vx*=.95}}
// Multiple collision passes make stacks settle more naturally.
for(let pass=0;pass<3;pass++){let merged=false;outer:for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;if(dist>=min)continue;if(a.level===b.level&&a.age>.12&&b.age>.12){merge(a,b);merged=true;break outer}const nx=dist>.001?dx/dist:1,ny=dist>.001?dy/dist:0,overlap=min-Math.max(dist,.001),ma=a.r*a.r,mb=b.r*b.r,sum=ma+mb;a.x-=nx*overlap*(mb/sum);a.y-=ny*overlap*(mb/sum);b.x+=nx*overlap*(ma/sum);b.y+=ny*overlap*(ma/sum);const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-(1.13)*rel/(1/ma+1/mb);a.vx-=impulse*nx/ma;a.vy-=impulse*ny/ma;b.vx+=impulse*nx/mb;b.vy+=impulse*ny/mb}}if(merged)break;for(const b of balls){b.x=clamp(b.x,b.r,W-b.r);if(b.y+b.r>H){b.y=H-b.r;if(b.vy>0)b.vy=0}}}
const danger=balls.some(b=>b.age>1.5&&b.y-b.r<54&&Math.abs(b.vy)<45);overTime=danger?overTime+dt:Math.max(0,overTime-dt*2);if(overTime>1.8){gameOver=true;notice.textContent='ゲームオーバー！「最初から」で再挑戦できます'}}
function circle(b,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.clip();ctx.fillStyle=colors[b.level];ctx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2);const im=imgs[b.level];if(im)ctx.drawImage(im,b.x-b.r,b.y-b.r,b.r*2,b.r*2);else{ctx.font=`${Math.round(b.r*1.1)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emojis[b.level],b.x,b.y+1)}ctx.restore();ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.strokeStyle='#ffffffbb';ctx.lineWidth=2;ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f7e7c5';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d98a77';ctx.setLineDash([9,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,55);ctx.lineTo(W,55);ctx.stroke();ctx.setLineDash([]);for(const b of balls)circle(b);if(!gameOver&&canDrop){const r=radii[nextLevel];circle({x:clamp(aimX,r,W-r),y:30,r,level:nextLevel},.65)}if(gameOver){ctx.fillStyle='#111827bd';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 31px sans-serif';ctx.fillText('GAME OVER',W/2,H/2-15);ctx.font='20px sans-serif';ctx.fillText('SCORE: '+score,W/2,H/2+22)}}
function loop(now){const elapsed=Math.min((now-last)/1000,.05);last=now;acc+=elapsed;let n=0;while(acc>=1/120&&n++<6){if(!gameOver)step(1/120);acc-=1/120}draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script></body></html>
